services:
  db:
    image: postgis/postgis:15-3.3
    container_name: gowayki_db_container
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - ":5432"
    volumes:
      - gowayki_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  gowayki_pgdata:
