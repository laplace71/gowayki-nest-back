spring.application.name=gowayki-nest

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:gowayki_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.storage.upload-dir=${UPLOAD_DIR:uploads/audios}

# Firma de los JWT del chat. En producción SIEMPRE por variable de entorno:
# `openssl rand -base64 48` y a JWT_SECRET. El valor por defecto es solo para
# desarrollo local (HS256 exige al menos 32 bytes).
app.jwt.secret=${JWT_SECRET:wayki-nest-dev-secret-no-usar-en-produccion}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
